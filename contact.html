<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/fonts.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Contact Us — Dynatec Industrial Solutions</title>
</head>
<body>
    <div class="flex min-h-screen flex-col">
        <header id="main-header" class="sticky top-0 z-50 w-full bg-white/90 backdrop-blur-md border-b border-slate-200"></header>

        <main class="flex-1">
            <div class="bg-slate-50 border-b border-slate-200 py-4">
                <div class="container">
                    <nav class="flex text-sm text-slate-500">
                        <a href="index.html" class="hover:text-brand">Home</a>
                        <span class="mx-2">/</span>
                        <span class="font-medium text-steel">Contact Us</span>
                    </nav>
                </div>
            </div>

            <section class="py-20 lg:py-28 bg-white">
                <div class="container">
                    <div class="grid lg:grid-cols-2 gap-12 lg:gap-16">
                        <div>
                            <h2 class="font-heading text-4xl text-steel mb-6">Get In Touch</h2>
                            <p class="text-slate-600 mb-8">Our team is ready to discuss your engineering needs. Visit our office or reach out via phone or email.</p>

                            <div class="space-y-6">
                                <div class="flex gap-4">
                                    <div class="w-12 h-12 bg-brand/10 rounded-full flex items-center justify-center text-brand">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin w-6 h-6"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                    </div>
                                    <div>
                                        <h4 class="font-semibold text-steel">Office Location</h4>
                                        <p class="text-slate-500">Spur Mall, Ruiru, Kenya</p>
                                    </div>
                                </div>
                                <div class="flex gap-4">
                                    <div class="w-12 h-12 bg-brand/10 rounded-full flex items-center justify-center text-brand">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-phone w-6 h-6"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"></path></svg>
                                    </div>
                                    <div>
                                        <h4 class="font-semibold text-steel">Phone</h4>
                                        <a href="tel:+254143293534" class="text-slate-500 hover:text-brand">+254 143 293 534</a>
                                    </div>
                                </div>
                                <div class="flex gap-4">
                                    <div class="w-12 h-12 bg-brand/10 rounded-full flex items-center justify-center text-brand">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mail w-6 h-6"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path><rect x="2" y="4" width="20" height="16" rx="2"></rect></svg>
                                    </div>
                                    <div>
                                        <h4 class="font-semibold text-steel">Email</h4>
                                        <a href="mailto:info@dynatecltd.com" class="text-slate-500 hover:text-brand">info@dynatecltd.com</a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-50 p-8 rounded-2xl border border-slate-200">
                            <h3 class="font-heading text-2xl text-steel mb-6">Send us a Message</h3>
                            <form class="space-y-4">
                                <input type="text" placeholder="Your Name" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand/30">
                                <input type="email" placeholder="Your Email" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand/30">
                                <textarea rows="4" placeholder="Your Message" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand/30 resize-none"></textarea>
                                <button class="w-full bg-brand text-white font-semibold py-3 rounded-lg hover:brightness-110 transition-all">Send Message</button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer id="main-footer" class="bg-slate-900 text-white pt-16 lg:pt-20 pb-8"></footer>
    </div>
    <script src="assets/js/main.js"></script>
</body>
</html>
